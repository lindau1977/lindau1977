<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ievades forma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Ievades forma</h2>
        <!-- Ievades forma
        <form action="formas_apstrades_fails.php" method="get/post">
            Formas lauki
        </form>
        -->
        <form id="forma">
            <div class="form-group">
                <label for="vards">Vārds: </label> <!-- Ievades lauka nosaukums -->
                <input type="text" class="form-control" id="vards" name="vards" placeholder="Ievadi savu vārdu..." required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="epasts">E-pasts: </label>
                <input type="email" class="form-control" id="epasts" name="epasts" placeholder="____@___.__" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="vecums">Vecums: </label>
                <input type="number" class="form-control" id="vecums" name="vecums" min="0" max="120">
            </div>
            <div class="form-group">
                <label for="datums">Datums: </label>
                <input type="date" class="form-control" id="datums" name="datums">
            </div>
            

            <div class="form-group">
                <label for="laiks">Laiks: </label>
                <input type="time" class="form-control" id="laiks" name="laiks" min="09:00" max="18:00">
            </div>
            <div class="form-group">
                <label for="krasa">Izvēlies krāsu: </label>
                <input type="color" class="form-control" id="krasa" name="krasa">
            </div>
            <!-- Krāsa tiks atgriezta kā hex vērtība -->

            <div class="form-group">
                <label for="parole">Parole: </label>
                <input type="password" class="form-control" id="parole" name="parole" autocomplete="off" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,}">
                <!-- pattern jeb šablons/veidne parolei, izmantojot Regular Expressions (RegEx)
                https://regexr.com/ - piemēri, cheatsheet, pārbaudēm
                Vismaz 8 simboli, lielie un mazie burti, cipari, speciālie simboli
                (?=.*\d)    - vismaz viens cipars
                (?=.*[a-z]) - vismaz viens mazais burts
                (?=.*[A-Z]) - vismaz viens lielais burts
                (?=.*\W)    - vismaz viens speciālais simbols
                .{8,}       - vismaz 8 simboli                
                -->
            </div><br>
            <div class="input-group-append">
                <span class="input-group-text" id="showPassword" style="display:inline;">🙉</span>
                <!-- Windows emoji izvēlne - Windows poga + . -->
                <span class="input-group-text" id="hidePassword" style="display:none;">🙈</span>
            </div>
            <!-- Vieta paroles ievades formātam/kļūdām -->
             <span id="passwordError" class="text-danger"></span>
            <br>
            <!-- Iesniegšanas poga -->
            <button type="submit" class="btn btn-primary">Iesniegt</button>
        </form>

        <h2 class="mt-5">Formas datu izvade</h2>
        <div id="izvade"></div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>


<!-- JS kods, lai aizliegtu izvēlēties iepriekšējos datumus un šodienu -->
<script>
    let sodiena = new Date();
    sodiena.setDate(sodiena.getDate()+1); //Pārejam uz nākamo dienu
    let minDatums = sodiena.toISOString().split('T')[0];
    document.getElementById("datums").setAttribute("min", minDatums);

    let parolesLauks = document.getElementById("parole");
    let raditParoli = document.getElementById("showPassword");
    let sleptParoli = document.getElementById("hidePassword");
    raditParoli.addEventListener("click", function() {
        parolesLauks.type = "password";
        raditParoli.style.display = "none";
        sleptParoli.style.display = "inline";
    });
    sleptParoli.addEventListener("click", function() {
        parolesLauks.type = "password";
        raditParoli.style.display = "inline";
        sleptParoli.style.display = "none";
    });

    parolesLauks.addEventListener("input", function() {
        const parole = this.value;
        const passwordError = document.getElementById("passwordError");
        const pattern = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*\W).{8,}$/;
        if (!pattern.test(parole)) {
            passwordError.innerText = "";
        } else {
            passwordError.innerText = "Parolei jāsatur vismaz viens cipars, lielais burts, mazais burts un speciālais simbols. Parolei jābūt vismaz 8 simbolus garai.";
        }
    });

    document.getElementById("forma").addEventListener("submit", function(event) {
        event.preventDefault();
        const name = document.getElementById("vards").value;
        const email = document.getElementById("epasts").value;
        const age = document.getElementById("vecums").value;
        const date = document.getElementById("datums").value;
        const time = document.getElementById("laiks").value;
        const color = document.getElementById("krasa").value;
        const password = document.getElementById("parole").value;

        document.getElementById("izvade").innerHTML = `
            <p class="bg-light">Vārds: ${name}</p>
            <p class="bg-light">E-pasts: ${email}</p>
            <p class="bg-light">Vecums: ${age}</p>
            <p class="bg-light">Datums: ${date}</p>
            <p class="bg-light">Laiks: ${time}</p>
            <p class="bg-light">Krāsa: ${color}</p>
            <p class="bg-light">Parole: ${password}</p>
        `;
    }); 
 </script>

</body>
</html>
