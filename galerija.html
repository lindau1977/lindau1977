<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attēlu galerija</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Lightbox CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.5/css/lightbox.min.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="container mt-5 border bg-light pt-3 pb-3">
        <h1 class="display-2 text-center pb-1">Attēlu galerija</h1>
        <div class="row border bg-white p-3 m-2">
            <div class="col-md-4 text-center">
                <a href="images/image1.jpeg" data-lightbox="gallery" data-title="Putns">
                    <img src="images/image1.jpeg" class="img-fluid mb-4" alt="Putns" style="width: 18rem;">
                </a>
            </div>
            <div class="col-md-4 text-center">
                <a href="images/image2.jpg" data-lightbox="gallery" data-title="Koks">
                    <img src="images/image2.jpg" class="img-fluid mb-4" alt="Koks" style="width: 18rem;">
                </a>
            </div>
            <div class="col-md-4 text-center">
                <a href="images/image3.jpg" data-lightbox="gallery" data-title="Puķe">
                    <img src="images/image3.jpg" class="img-fluid mb-4" alt="Puķe" style="width: 18rem;">
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js">
    </script>

    <!-- Lightbox JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.5/js/lightbox.min.js"></script>
</body>
</html>
